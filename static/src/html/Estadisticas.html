<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>Estadísticas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='src/css/style.css') }}">
    <script src="https://code.highcharts.com/highcharts.js"></script>
  </head>
  <body>
    <header class="navbar">
        <h1>Unión de Ornitólogos de Chile</h1>
        <a class="navbar-page" href="{{ url_for('index') }}">Inicio</a>
        <a id="logout-btn" href="{{ url_for('logout') }}">Cerrar Sesión</a>
    </header>
    <div class="container">
      <nav class="navbar">
        <a href="{{ url_for('registrar_avistamiento') }}" class="boton-enlace">Reportar Avistamiento</a>
        <a href="{{ url_for('listado') }}" class="boton-enlace">Ver Listado</a>
        <a href="{{ url_for('estadisticas') }}" class="boton-enlace">Ver Estadísticas</a>
    </div>
    <main class ="main-container">
    <h2>Estadísticas y métricas de Avistamientos</h2>
    <p>Resumen de registro de voluntarios y avistamientos de aves en Chile.</p>
    <div id="chart-dias" style=" width:100%; height:350px;"></div>
    <div id="chart-tipos" style="width: 100%; height: 350px;"></div>
    <div id="chart-comunas" style="width: 100%; height: 350px;"></div>
    
    <p><a href = "{{ url_for('index') }}"> Volver a la portada</a></p>
    </main>

    <script>
    const renderGraficoDias = (datos) => {
        Highcharts.chart('chart-dias', {
          chart: { type: 'line' },
          title: { text: 'Avistamientos por Día' },
          xAxis: { categories: datos.map(d => d.dia) },
          series: [{ name: 'Avistamientos', data: datos.map(d => d.total) }]
        });
      };

      const renderGraficoTipos = (datos) => {
        Highcharts.chart('chart-tipos', {
          chart: { type: 'pie' },
          title: { text: 'Avistamientos por Tipo de Ave' },
          series: [{
            name: 'Aves',
            data: datos.map(d => ({ name: d.tipo, y: d.total }))
          }]
        });
      };

      const renderGraficoComunas = (datos) => {
        Highcharts.chart('chart-comunas', {
          chart: { type: 'column' },
          title: { text: 'Voluntarios por Comuna' },
          xAxis: { categories: datos.map(d => d.comuna) },
          series: [{ name: 'Voluntarios', data: datos.map(d => d.total) }]
        });
      };

      const cargarStatsDias = () => {
        fetch('/api/stats-dias')
          .then(res => res.json())
          .then(data => renderGraficoDias(data));
      };

      const cargarStatsTipos = () => {
        fetch('/api/stats-tipos')
          .then(res => res.json())
          .then(data => renderGraficoTipos(data));
      };

      const cargarStatsComunas = () => {
        fetch('/api/stats-comunas')
          .then(res => res.json())
          .then(data => renderGraficoComunas(data));
      };

      document.addEventListener('DOMContentLoaded', () => {
        cargarStatsDias();
        cargarStatsTipos();
        cargarStatsComunas();
      });
    </script>

  </body>
</html>
